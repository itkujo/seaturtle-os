# SeaTurtleOS — Production Compose Stack (Pi deployment)
#
# Differences from deploy/compose/compose.base.yaml (dev):
# - Only NPM ports (80, 443, 81) and MQTT (1883) exposed to host
# - All other services accessible only via NPM reverse proxy
# - Signal-K uses real hardware (no --sample-nmea0183-data)
# - Landing page on port 8080 (internal, proxied by NPM)
# - Status API on port 8081 (internal, proxied by NPM)

networks:
  seaturtle:
    name: seaturtle

services:
  # ── Status API ────────────────────────────────────────────────
  status-api:
    image: seaturtle/status-api:latest
    container_name: seaturtle-status-api
    restart: unless-stopped
    environment:
      - COMPOSE_PROJECT=seaturtle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - seaturtle
    healthcheck:
      test: ["CMD", "/status-api", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Landing Page ──────────────────────────────────────────────
  landing:
    image: nginx:1-alpine
    container_name: seaturtle-landing
    restart: unless-stopped
    volumes:
      - ./config/landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/landing/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - seaturtle
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Reverse Proxy ─────────────────────────────────────────────
  # The ONLY service with host-exposed HTTP ports.
  # All other web UIs are accessed through NPM proxy hosts.
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.14.0
    container_name: seaturtle-npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./data/npm/data:/data
      - ./data/npm/letsencrypt:/etc/letsencrypt
    networks:
      - seaturtle
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81/api/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── MQTT Auth Init ────────────────────────────────────────────
  mosquitto-init:
    image: eclipse-mosquitto:2
    container_name: seaturtle-mosquitto-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        PASSWD_FILE=/mosquitto/data/passwd
        if [ -f "$$PASSWD_FILE" ]; then
          echo "mosquitto-init: password file exists, skipping"
        else
          echo "mosquitto-init: generating password file"
          mosquitto_passwd -b -c "$$PASSWD_FILE" "$$MQTT_USER" "$$MQTT_PASS"
          chown mosquitto:mosquitto "$$PASSWD_FILE"
          echo "mosquitto-init: done"
        fi
    environment:
      - MQTT_USER=${SEATURTLE_MQTT_USER:-seaturtle}
      - MQTT_PASS=${SEATURTLE_MQTT_PASSWORD:-changeseaturtle}
    volumes:
      - ./data/mosquitto/data:/mosquitto/data
    networks:
      - seaturtle

  # ── MQTT Broker ───────────────────────────────────────────────
  # Port 1883 exposed to host for direct NMEA/IoT device connections.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: seaturtle-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    networks:
      - seaturtle
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/uptime' -C 1 -W 3 -u $${MQTT_USER} -P $${MQTT_PASS}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - MQTT_USER=${SEATURTLE_MQTT_USER:-seaturtle}
      - MQTT_PASS=${SEATURTLE_MQTT_PASSWORD:-changeseaturtle}

  # ── Flow Engine ───────────────────────────────────────────────
  nodered:
    image: nodered/node-red:4.1.8
    container_name: seaturtle-nodered
    restart: unless-stopped
    environment:
      - NODE_RED_CREDENTIAL_SECRET=${SEATURTLE_INITIAL_PASSWORD:-changeseaturtle}
      - MQTT_USER=${SEATURTLE_MQTT_USER:-seaturtle}
      - MQTT_PASS=${SEATURTLE_MQTT_PASSWORD:-changeseaturtle}
      - TZ=${TZ:-UTC}
    volumes:
      - ./config/nodered/settings.js:/data/settings.js:ro
      - ./data/nodered:/data
    networks:
      - seaturtle
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Container Management ──────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:2.27.3
    container_name: seaturtle-portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/portainer:/data
    networks:
      - seaturtle
    healthcheck:
      disable: true

  # ── Metrics Collection ────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: seaturtle-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./data/prometheus:/prometheus
    networks:
      - seaturtle
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Marine Data Hub ───────────────────────────────────────────
  # Production mode: no --sample-nmea0183-data flag.
  # Signal-K auto-discovers NMEA devices via /dev serial ports.
  signalk:
    image: seaturtle/signalk:latest
    container_name: seaturtle-signalk
    restart: unless-stopped
    environment:
      - IS_IN_DOCKER=true
      - MQTT_USER=${SEATURTLE_MQTT_USER:-seaturtle}
      - MQTT_PASS=${SEATURTLE_MQTT_PASSWORD:-changeseaturtle}
      - TZ=${TZ:-UTC}
    volumes:
      - ./data/signalk:/home/node/.signalk
      - /dev:/dev
    networks:
      - seaturtle
    depends_on:
      mosquitto:
        condition: service_healthy
    # Privileged for /dev access (NMEA serial devices)
    privileged: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/signalk"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Dashboards ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.6.0
    container_name: seaturtle-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${SEATURTLE_INITIAL_PASSWORD:-changeseaturtle}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://grafana.seaturtle.local
      - GF_LOG_MODE=console
      - TZ=${TZ:-UTC}
    volumes:
      - ./data/grafana:/var/lib/grafana
    networks:
      - seaturtle
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
