# SeaTurtleOS — Base Service Stack
# Start:  docker compose -f compose.base.yaml up -d
# Stop:   docker compose -f compose.base.yaml down
# Logs:   docker compose -f compose.base.yaml logs -f [service]

networks:
  seaturtle:
    name: seaturtle

services:
  # ── Status API ──────────────────────────────────────────────────
  # Reports Docker container status as JSON.
  # API: http://localhost:8081/api/status
  status-api:
    build:
      context: ./config/status-api
      dockerfile: Dockerfile
    image: seaturtle/status-api:latest
    container_name: seaturtle-status-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - COMPOSE_PROJECT=compose
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - seaturtle
    healthcheck:
      test: ["CMD", "/status-api", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Landing Page ────────────────────────────────────────────────
  # Shows all service links and default credentials.
  # GUI: http://localhost:8080
  landing:
    image: nginx:1-alpine
    container_name: seaturtle-landing
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config/landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/landing/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - seaturtle
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Reverse Proxy ──────────────────────────────────────────────
  # GUI: http://localhost:81
  # Default login: admin@example.com / changeme (forced change on first login)
  # ADR: docs/adr/0001-reverse-proxy-nginx-proxy-manager.md
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.14.0
    container_name: seaturtle-npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./data/npm/data:/data
      - ./data/npm/letsencrypt:/etc/letsencrypt
    networks:
      - seaturtle
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81/api/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── MQTT Auth Init ────────────────────────────────────────────
  # Generates Mosquitto password file on first boot, then exits.
  mosquitto-init:
    image: eclipse-mosquitto:2
    container_name: seaturtle-mosquitto-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        PASSWD_FILE=/mosquitto/data/passwd
        if [ -f "$$PASSWD_FILE" ]; then
          echo "mosquitto-init: password file exists, skipping"
        else
          echo "mosquitto-init: generating password file"
          mosquitto_passwd -b -c "$$PASSWD_FILE" "$$MQTT_USER" "$$MQTT_PASS"
          chown mosquitto:mosquitto "$$PASSWD_FILE"
          echo "mosquitto-init: done"
        fi
    environment:
      - MQTT_USER=${SEATURTLE_MQTT_USER:-seaturtle}
      - MQTT_PASS=${SEATURTLE_MQTT_PASSWORD:-changeseaturtle}
    volumes:
      - ./data/mosquitto/data:/mosquitto/data
    networks:
      - seaturtle

  # ── MQTT Broker ────────────────────────────────────────────────
  # MQTT: localhost:1883   WebSocket: localhost:9001
  # Credentials: $SEATURTLE_MQTT_USER / $SEATURTLE_MQTT_PASSWORD
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: seaturtle-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    networks:
      - seaturtle
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/uptime' -C 1 -W 3 -u $${MQTT_USER} -P $${MQTT_PASS}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - MQTT_USER=${SEATURTLE_MQTT_USER:-seaturtle}
      - MQTT_PASS=${SEATURTLE_MQTT_PASSWORD:-changeseaturtle}

  # ── Flow Engine ────────────────────────────────────────────────
  # GUI: http://localhost:1880
  # Login: admin / $SEATURTLE_INITIAL_PASSWORD
  nodered:
    image: nodered/node-red:4.1.8
    container_name: seaturtle-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - NODE_RED_CREDENTIAL_SECRET=${SEATURTLE_INITIAL_PASSWORD:-changeseaturtle}
      - MQTT_USER=${SEATURTLE_MQTT_USER:-seaturtle}
      - MQTT_PASS=${SEATURTLE_MQTT_PASSWORD:-changeseaturtle}
      - TZ=${TZ:-UTC}
    volumes:
      - ./config/nodered/settings.js:/data/settings.js:ro
      - ./data/nodered:/data
    networks:
      - seaturtle
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Container Management ───────────────────────────────────────
  # GUI: http://localhost:9000
  # First login requires interactive password creation.
  portainer:
    image: portainer/portainer-ce:2.27.3
    container_name: seaturtle-portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/portainer:/data
    networks:
      - seaturtle
    # Note: Portainer CE 2.27+ ships a minimal container with no shell or
    # CLI tools (no wget, curl, or sh). Health check is not possible from
    # inside the container. Rely on Docker's restart policy instead.
    healthcheck:
      disable: true

  # ── Metrics Collection ─────────────────────────────────────────
  # GUI: http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: seaturtle-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./data/prometheus:/prometheus
    networks:
      - seaturtle
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Marine Data Hub ───────────────────────────────────────────────
  # GUI: http://localhost:3000
  # REST: http://localhost:3000/signalk/v1/api/
  # WebSocket: ws://localhost:3000/signalk/v1/stream
  # Runs with simulated NMEA0183 data for development.
  # ADR: docs/adr/0003-signal-k-integration.md
  signalk:
    build:
      context: ./config/signalk
      dockerfile: Dockerfile
    image: seaturtle/signalk:latest
    container_name: seaturtle-signalk
    restart: unless-stopped
    ports:
      - "3000:3000"
    command: ["--sample-nmea0183-data"]
    environment:
      - IS_IN_DOCKER=true
      - MQTT_USER=${SEATURTLE_MQTT_USER:-seaturtle}
      - MQTT_PASS=${SEATURTLE_MQTT_PASSWORD:-changeseaturtle}
      - TZ=${TZ:-UTC}
    volumes:
      - ./data/signalk:/home/node/.signalk
    networks:
      - seaturtle
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/signalk"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Dashboards ─────────────────────────────────────────────────
  # GUI: http://localhost:3001
  # Default login: admin / $SEATURTLE_INITIAL_PASSWORD
  grafana:
    image: grafana/grafana:11.6.0
    container_name: seaturtle-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${SEATURTLE_INITIAL_PASSWORD:-changeseaturtle}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_LOG_MODE=console
      - TZ=${TZ:-UTC}
    volumes:
      - ./data/grafana:/var/lib/grafana
    networks:
      - seaturtle
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
