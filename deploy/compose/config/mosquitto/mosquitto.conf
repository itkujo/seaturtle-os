# SeaTurtleOS — Mosquitto MQTT Broker Configuration
# Docs: https://mosquitto.org/man/mosquitto-conf-5.html

# ── Listeners ────────────────────────────────────────────────────
# Standard MQTT on port 1883
listener 1883
protocol mqtt

# WebSocket on port 9001 (for browser-based MQTT clients)
listener 9001
protocol websockets

# ── Authentication ───────────────────────────────────────────────
# Allow anonymous for local development.
# For production, set to false and configure a password file or auth plugin.
allow_anonymous true

# ── Persistence ──────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ──────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type warning
log_type error
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
