server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No caching — page reflects current config
    add_header Cache-Control "no-store, no-cache, must-revalidate";

    location / {
        try_files $uri $uri/ =404;
    }

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
